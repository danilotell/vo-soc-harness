name: Secrets

# Generic secret detection, which GitHub's own scanning does not cover here.
#
# What is already covered, and why this exists anyway:
#
# * GitHub secret scanning and push protection are enabled, and on a public repo
#   they match **provider** patterns — an AWS key, a GitHub token, a Slack webhook.
#   The non-provider patterns that catch a generic `password = "..."` or an opaque
#   Vision One key need GitHub Secret Protection, which this repository does not
#   have: the API accepts the request to enable them and leaves them disabled.
# * `dev/check_publishable.py` is stricter, but it is NOT in the repository
#   (`dev/` is gitignored). It runs from the pre-push hook of a clone that has it,
#   so it cannot run here and never runs for a pull request from a fork.
#
# So this is the only generic check that covers a contribution from someone else.

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this job only reads the checkout.
permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      # Full history: a secret is exposed by the commit that introduced it even if
      # a later commit removed it, and rotating it is the only real fix.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Third-party action, so pinned to a commit SHA and not to a tag: a tag can
      # be moved to point at other code, and this step reads the whole repository.
      # Dependabot updates a SHA pin like any other reference. v3.0.0 differs from
      # v2 only in the Node runtime (20 -> 24); no license key is required for a
      # repository owned by a personal account.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
